<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="umbrellaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4f70" />
      <stop offset="50%" stop-color="#b648ff" />
      <stop offset="100%" stop-color="#22d3ff" />
    </linearGradient>
  </defs>
  
  <!-- Tiny cap on top -->
  <path d="M 50 10 L 50 5" fill="none" stroke="url(#umbrellaGrad)" stroke-width="6" stroke-linecap="round" />

  <g fill="none" stroke="url(#umbrellaGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main canopy outline -->
    <path d="M 10 50 A 40 40 0 0 1 90 50" />
    
    <!-- Scalloped bottom -->
    <path d="M 10 50 Q 20 38, 30 50 Q 40 38, 50 50 Q 60 38, 70 50 Q 80 38, 90 50" />
    
    <!-- Ribs -->
    <path d="M 30 50 Q 38 25, 50 10" />
    <path d="M 50 50 L 50 10" />
    <path d="M 70 50 Q 62 25, 50 10" />
    
    <!-- Handle -->
    <path d="M 50 50 L 50 85 A 8 8 0 0 0 66 85" />
  </g>
</svg>